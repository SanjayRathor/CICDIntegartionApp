# Standard Industry CI/CD Pipeline Example
# This is what production-ready pipelines look like

name: Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'  # Nightly builds

env:
  XCODE_VERSION: '15.0'
  IOS_VERSION: '17.0'

jobs:
  # ============================================
  # STAGE 1: CODE QUALITY & LINTING
  # ============================================
  lint:
    name: Code Quality Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict
          
      - name: Danger (Code Review)
        run: |
          bundle exec danger
          
      - name: Security Scan
        uses: snyk/actions/swift@master
        with:
          args: --severity-threshold=high

  # ============================================
  # STAGE 2: BUILD
  # ============================================
  build:
    name: Build Application
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
        
      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Caches/CocoaPods
            Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          
      - name: Install Dependencies
        run: |
          pod install
          
      - name: Build App
        run: |
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme Production \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            CODE_SIGNING_ALLOWED=NO

  # ============================================
  # STAGE 3: UNIT TESTS
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Unit Tests
        run: |
          fastlane test
          
      - name: Code Coverage
        run: |
          xcov --minimum_coverage_percentage 80
          
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: test_output/report.junit
          reporter: java-junit

  # ============================================
  # STAGE 4: UI TESTS
  # ============================================
  ui-tests:
    name: UI Tests
    runs-on: macos-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Run UI Tests
        run: |
          fastlane ui_test
          
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: fastlane/screenshots

  # ============================================
  # STAGE 5: INTEGRATION TESTS
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Integration Tests
        run: |
          fastlane integration_test

  # ============================================
  # STAGE 6: BUILD ARTIFACTS
  # ============================================
  build-ipa:
    name: Build IPA
    runs-on: macos-latest
    needs: [unit-tests, ui-tests, integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      
      - name: Import Certificates
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P $P12_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
      - name: Build & Sign IPA
        run: |
          fastlane build
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            *.ipa
            *.dSYM.zip
          retention-days: 30

  # ============================================
  # STAGE 7: DEPLOY TO TESTFLIGHT (Staging)
  # ============================================
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-latest
    needs: build-ipa
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://testflight.apple.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: app-release
          
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          fastlane pilot upload \
            --skip_waiting_for_build_processing \
            --changelog "Automated build from develop"
            
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ New build deployed to TestFlight"
            }

  # ============================================
  # STAGE 8: DEPLOY TO APP STORE (Production)
  # ============================================
  deploy-production:
    name: Deploy to App Store
    runs-on: macos-latest
    needs: build-ipa
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://apps.apple.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: app-release
          
      - name: Upload to App Store
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          fastlane deliver \
            --submit_for_review \
            --automatic_release \
            --force
            
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          
      - name: Notify Team
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 New version deployed to App Store!"
            }

  # ============================================
  # STAGE 9: MONITORING & ROLLBACK
  # ============================================
  post-deploy-monitoring:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Health Check
