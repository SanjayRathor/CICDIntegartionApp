name: iOS CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Install Fastlane
      run: |
        gem install fastlane
        echo "✅ Fastlane installed successfully"
        
    - name: Run Unit Tests
      id: tests
      run: |
        cd CICDIntegartionApp/CICDIntegartionApp
        echo "🧪 Starting test execution..."
        fastlane test
        echo "✅ All tests passed!"
      continue-on-error: true
        
    - name: Parse Test Results
      if: always()
      run: |
        cd CICDIntegartionApp/CICDIntegartionApp
        if [ -f "test_output/report.junit" ]; then
          echo "📊 Test Results Summary:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          TOTAL=$(grep -o "tests='[0-9]*'" test_output/report.junit | head -1 | grep -o "[0-9]*")
          FAILURES=$(grep -o "failures='[0-9]*'" test_output/report.junit | head -1 | grep -o "[0-9]*")
          
          echo "Total Tests: $TOTAL"
          echo "Failures: $FAILURES"
          echo "Passed: $((TOTAL - FAILURES))"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ "$FAILURES" -gt 0 ]; then
            echo "❌ Failed Tests:"
            grep "<failure" test_output/report.junit | sed 's/.*message="\([^"]*\)".*/  - \1/'
          fi
        fi
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: CICDIntegartionApp/CICDIntegartionApp/test_output/
        retention-days: 30
        
    - name: Fail if tests failed
      if: steps.tests.outcome == 'failure'
      run: |
        echo "❌ Tests failed! Check logs above for details."
        exit 1

  build:
    name: Build App
    runs-on: macos-latest
    needs: test
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        
    - name: Install Fastlane
      run: gem install fastlane
        
    - name: Build iOS App
      run: |
        cd CICDIntegartionApp/CICDIntegartionApp
        fastlane build
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: CICDIntegartionApp/CICDIntegartionApp/*.ipa
